<!DOCTYPE html>
<html>
<head>
    <style> 
:root {
    --background: #ffb791;
    --surface: #ffffff;
    --text: #20232a;
    --muted: #777d89;
    --accent: #426de8;
    --border: #e5e7eb;
    --radius: 9px;
}
body {
    background-color: var(--background);
    color: var(--text);
    font-family: "Courier", sans-serif;
    margin: 0;
    height: 100vh; 
}
.main {
    display: grid;
    grid-template-columns: minmax(100px, 1fr) minmax(0, 2fr) minmax(100px, 1fr);
    gap: 20px;
    padding: 0px;
    height: 100vh;
    box-sizing: border-box;
    overflow: hidden;
}
.chat-area {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100vh;
    background-color: var(--surface);
    box-sizing: border-box;
}
.input-area {
    display: flex;
    background-color: var(--surface);
    padding: 10px;
    box-sizing: border-box;
}
    </style>
</head>
<body>
    <div class="main">
        <div class="left-sidebar">
            <div class="sidebar-content">
                <h2>Left Sidebar</h2>
                <p>This is the left sidebar content.</p>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-content">
                <h2>Chat Area</h2>
                <p>This is the chat area content.</p>
            </div>
            <div class="input-area">
                <input type="text" placeholder="Type a message...">
                <button>Send</button>
            </div>
        </div>
        <div class="right-sidebar">
            <div class="sidebar-content">
                <h2>Right Sidebar</h2>
                <p>This is the right sidebar content.</p>
            </div>
        </div>
    </div>
</body>
</html>
